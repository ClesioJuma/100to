<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100toDesign — desenho de sistemas</title>
<meta name="description" content="116 exercícios de desenho de sistemas em 3 níveis, de um pedido HTTP à escala global.">
<link rel="icon" type="image/svg+xml" href="../icon-design.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../style.css">
<script>
  (function () {
    var saved = localStorage.getItem("100to:theme");
    if (saved === "light" || saved === "dark") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  })();
</script>
</head>
<body>
<a class="skip-link" href="#content">Saltar para o conteúdo</a>
<header class="app-header">
  <div class="brand">
    <a class="brand-home" href="../" title="Voltar ao 100to">100to</a>
    <img class="brand-logo" id="app-logo" src="../icon-design.svg" alt="Design">
    <div>
      <h1 id="app-nome">Design</h1>
      <p class="tagline" id="app-tagline"></p>
    </div>
  </div>
  <div class="overall-progress">
    <div class="overall-progress-text">
      <span id="overall-count">0 / 0</span>
      <span class="overall-progress-pct" id="overall-pct">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="overall-fill"></div>
    </div>
    <p class="overall-motivation" id="overall-motivation"></p>
  </div>
  <div class="header-actions">
    <a class="link-outro" id="link-outro" href="../go/">Go</a>
    <button id="theme-toggle" class="icon-btn" title="Alternar tema"></button>
    <button id="reset-btn" class="reset-btn" title="Reiniciar todo o progresso">Reiniciar progresso</button>
  </div>
</header>

<nav class="nivel-tabs" id="nivel-tabs"></nav>
<div class="nivel-nota" id="nivel-nota" hidden></div>
<nav class="trilha-tabs" id="trilha-tabs"></nav>

<main class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <section class="content" id="content" tabindex="-1"></section>
</main>

<script src="data.js"></script>
<script src="../app.js"></script>
</body>
</html>
