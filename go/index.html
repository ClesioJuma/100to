<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100toGo — trilha de Go</title>
<meta name="description" content="354 exercícios de Go em 3 níveis, do primeiro struct ao sistema distribuído.">
<link rel="icon" type="image/png" href="../golang.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../style.css">
<script>
  (function () {
    var saved = localStorage.getItem("100to:theme");
    if (saved === "light" || saved === "dark") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  })();
</script>
</head>
<body>
<a class="skip-link" href="#app-content">Saltar para o conteúdo</a>
<div class="app-shell">
  <aside class="app-nav">
    <div class="app-nav-brand">
      <a class="brand-home" href="../" title="Voltar ao 100to">100to</a>
      <div class="app-nav-produto">
        <img class="brand-logo" id="app-logo" src="../golang.png" alt="Go">
        <div>
          <span class="app-nav-nome" id="app-nome"></span>
          <span class="app-nav-tagline" id="app-tagline"></span>
        </div>
      </div>
    </div>
    <nav class="app-nav-links" id="app-nav-links"></nav>
    <div class="app-nav-footer">
      <a class="link-outro" id="link-outro" href="../design/">Design</a>
      <button id="reset-btn" class="app-nav-reset" title="Reiniciar todo o progresso">Reiniciar progresso</button>
    </div>
  </aside>

  <div class="app-main">
    <header class="app-topbar">
      <div class="app-topbar-search" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span>Pesquisar uma habilidade…</span>
      </div>
      <div class="app-topbar-actions">
        <button id="theme-toggle" class="icon-btn" title="Alternar tema"></button>
      </div>
    </header>
    <main class="app-content" id="app-content" tabindex="-1"></main>
  </div>
</div>

<script src="data.js"></script>
<script src="../app.js"></script>
</body>
</html>
